<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ATOMLAB · 原子观象台</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=SF+Pro+Display:wght@300;400;500;600;700&family=Noto+Sans+SC:wght@400;500;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
</head>
<body>
  <!-- HoloChem 浅色调开场 3D 动画 overlay -->
  <div id="chem-boot-loader" style="position: fixed; inset: 0; z-index: 99999; background: #f8fafc; display: flex; flex-direction: column; align-items: center; justify-content: center; transition: opacity 0.8s ease, visibility 0.8s ease;">
    <style>
      .chem-loader-box { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; text-align: center; font-family: 'Outfit', -apple-system, sans-serif; }
      .chem-atom-ring-container { position: relative; width: 110px; height: 110px; display: flex; align-items: center; justify-content: center; }
      .chem-core-glow { width: 22px; height: 22px; background: #0284c7; border-radius: 50%; box-shadow: 0 0 20px rgba(2, 132, 199, 0.6), 0 0 40px rgba(37, 99, 235, 0.4); animation: chemPulse 1.5s infinite alternate ease-in-out; }
      .chem-orbit-ring { position: absolute; border: 2px solid rgba(2, 132, 199, 0.35); border-radius: 50%; }
      .chem-ring-1 { width: 90px; height: 90px; transform: rotateX(65deg) rotateY(20deg); animation: chemSpin 3s linear infinite; }
      .chem-ring-2 { width: 90px; height: 90px; transform: rotateX(65deg) rotateY(80deg); animation: chemSpin 2.2s linear infinite reverse; }
      .chem-ring-3 { width: 90px; height: 90px; transform: rotateX(65deg) rotateY(140deg); animation: chemSpin 4s linear infinite; }
      @keyframes chemSpin { 0% { transform: rotateX(65deg) rotateY(0deg) rotateZ(0deg); } 100% { transform: rotateX(65deg) rotateY(0deg) rotateZ(360deg); } }
      @keyframes chemPulse { 0% { transform: scale(0.85); opacity: 0.8; } 100% { transform: scale(1.15); opacity: 1; } }
      .chem-title { font-size: 28px; font-weight: 800; letter-spacing: 2px; margin-top: 8px; background: linear-gradient(135deg, #0284c7, #2563eb); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
      .chem-sub { font-size: 13px; color: #64748b; font-weight: 600; letter-spacing: 1px; }
      .chem-meter-bar { width: 200px; height: 4px; background: #e2e8f0; border-radius: 9999px; overflow: hidden; position: relative; margin-top: 8px; }
      .chem-meter-fill { height: 100%; background: linear-gradient(90deg, #0284c7, #2563eb); width: 0%; transition: width 0.8s ease; border-radius: 9999px; }
    </style>
    <div class="chem-loader-box">
      <div class="chem-atom-ring-container">
        <div class="chem-core-glow"></div>
        <div class="chem-orbit-ring chem-ring-1"></div>
        <div class="chem-orbit-ring chem-ring-2"></div>
        <div class="chem-orbit-ring chem-ring-3"></div>
      </div>
      <div class="chem-title">HoloChem</div>
      <div class="chem-sub">3D 分子结构与反应观象台</div>
      <div class="chem-meter-bar">
        <div class="chem-meter-fill" id="chem-meter-fill"></div>
      </div>
    </div>
    <script>
      (function() {
        var fill = document.getElementById('chem-meter-fill');
        var loader = document.getElementById('chem-boot-loader');
        if(fill) setTimeout(function(){ fill.style.width = '75%'; }, 80);
        if(fill) setTimeout(function(){ fill.style.width = '100%'; }, 450);
        setTimeout(function(){
          if(loader) {
            loader.style.opacity = '0';
            loader.style.visibility = 'hidden';
            setTimeout(function(){ if(loader.parentNode) loader.parentNode.removeChild(loader); }, 800);
          }
        }, 900);
      })();
    </script>
  </div>

  <!-- 数学板块风格的环境极光影与粒子拖尾层 -->
  <div class="atmosphere"></div>
  <div class="ambient-glow bg-glow-1"></div>
  <div class="ambient-glow bg-glow-2"></div>
  <div id="cursor-glow"></div>
  <div id="trail-container" class="cursor-trail-container"></div>

  <div class="app">
    <!-- 3D Viewport Stage -->
    <main class="stage" id="stage">
      <div id="viewport" class="viewport">
        <!-- Holographic 3D Empty State Placeholder -->
        <div class="canvas-empty-state">
          <div class="holo-atom-ring">
            <div class="holo-core"></div>
            <div class="holo-orbit"></div>
            <div class="holo-orbit-2"></div>
            <div class="holo-orbit-3"></div>
          </div>
          <div class="holo-title">ATOMLAB 3D VIEWPORT</div>
          <div class="holo-desc">在上方输入化学式，或从左侧选择快捷试剂开启全息渲染</div>
        </div>
      </div>
    </main>

    <!-- Top Navigation Header -->
    <header class="top-header">


      <div class="spotlight-search-island" id="search-row">
        <!-- 动态多反应物输入容器 -->
        <div id="search-operands" class="search-operands-container">
          <div class="search-field" data-slot="a">
            <span class="search-slot-badge search-tag">A</span>
            <input id="query-a" class="search-input chem-input" type="text" autocomplete="off" spellcheck="false" />
          </div>
        </div>
        
        <!-- 增加多反应物/混合物的 + 按钮 -->
        <button type="button" id="btn-blend-add" class="btn-add-operand" title="增加反应物/混合物质 (+)" aria-label="增加反应物">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round">
            <line x1="12" y1="5" x2="12" y2="19"></line>
            <line x1="5" y1="12" x2="19" y2="12"></line>
          </svg>
        </button>

        <div class="custom-select-wrap" id="cond-dropdown-wrap">
          <button type="button" class="cond-select-trigger" id="cond-trigger" aria-haspopup="listbox" aria-expanded="false">
            <span id="cond-trigger-label">未指定条件</span>
            <svg class="chevron-icon" viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M6 9l6 6 6-6"/></svg>
          </button>
          <div class="cond-popover-menu hidden" id="cond-menu" role="listbox">
            <button type="button" class="cond-option-item is-selected" data-value="">未指定条件</button>
            <button type="button" class="cond-option-item" data-value="水溶液">水溶液</button>
            <button type="button" class="cond-option-item" data-value="加热">加热</option>
            <button type="button" class="cond-option-item" data-value="点燃">点燃</option>
          </div>
          <input type="hidden" id="reaction-condition" value="" />
        </div>

        <button id="btn-search" class="btn-search-action" type="button">
          <span>开始反应</span>
          <span>→</span>
        </button>
      </div>


    </header>

    <!-- Left Panel -->
    <aside class="panel panel-left glass-panel">
      <div class="mol-status-badge">
        <span class="pulse-dot"></span>
        <span id="hud-kicker">就绪 READY</span>
      </div>
      <h2 class="mol-name" id="hud-name">尚未查询</h2>
      <div class="mol-formula" id="hud-formula">在上方输入物质化学式</div>



      <section id="mol-info" hidden style="margin-top: 12px;">
        <div style="height: 1px; background: rgba(255,255,255,0.08); margin: 12px 0;"></div>
        <div class="card-title">分子档案</div>
        <dl class="info-list" id="info-list"></dl>
      </section>

      <div style="height: 1px; background: rgba(255,255,255,0.08); margin: 12px 0;"></div>

      <div class="card-title">视角控制</div>
      <div class="control-row">
        <span class="control-label">自动旋转</span>
        <label class="apple-switch">
          <input type="checkbox" id="auto-rotate" checked />
          <span class="slider"></span>
        </label>
      </div>

      <div class="control-row">
        <span class="control-label">原子标签</span>
        <label class="apple-switch">
          <input type="checkbox" id="show-labels" />
          <span class="slider"></span>
        </label>
      </div>

      <button type="button" id="btn-reset" class="btn-reset-view">
        <span>重置视角 (R)</span>
      </button>
    </aside>

    <!-- Right Panel -->
    <aside class="panel panel-right glass-panel" id="panel-composition">
      <div class="card-title">成分构成</div>
      <div id="composition-root" class="comp-empty-box">
        <div class="comp-empty-icon">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"/>
            <path d="M12 2a10 10 0 0 1 10 10"/>
            <path d="M12 12L2.05 13"/>
          </svg>
        </div>
        <p>查询物质后将自动计算元素组成及占比分析图表</p>
      </div>
    </aside>



    <!-- Overlay Modal -->
    <div class="overlay hidden" id="overlay">
      <div class="glass-panel" style="padding:28px;max-width:360px;text-align:center;">
        <button id="btn-overlay-close" style="float:right;background:none;border:none;color:#fff;cursor:pointer;">✕</button>
        <h3 id="overlay-title" style="margin-top:0;">处理中…</h3>
        <p id="overlay-desc" style="font-size:13px;color:rgba(255,255,255,0.7);"></p>
        <button id="btn-overlay-confirm" style="width:100%;height:36px;background:var(--accent-cyan);border:none;border-radius:10px;color:#fff;font-weight:600;margin-top:12px;cursor:pointer;">确定</button>
      </div>
    </div>
  </div>

  <script type="module" src="/src/chem/src/main.js"></script>
</body>
</html>
