<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HoloGrip - 关于我们 (名片)</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;700;900&display=swap');
        
        :root {
            --bg: #050505;
            --fg: #ffffff;
            --accent: #ff2a5f;
            --muted: #555555;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            background-color: var(--bg);
            color: var(--fg);
            font-family: 'Outfit', sans-serif;
            overflow: hidden;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        /* 粒子背景 canvas */
        #particles-js {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            z-index: 0;
        }

        /* 返回导航 */
        .navbar {
            position: fixed;
            top: 2rem;
            left: 3rem;
            z-index: 100;
        }
        .navbar a {
            color: var(--fg);
            text-decoration: none;
            font-size: 1rem;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: opacity 0.3s;
        }
        .navbar a:hover { opacity: 0.7; }
        .navbar a::before { content: '←'; transition: transform 0.3s; }
        .navbar a:hover::before { transform: translateX(-5px); }

        /* 内容层 */
        .content-wrapper {
            position: relative;
            z-index: 10;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1rem;
            animation: fadeIn 1.5s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes fadeIn {
            0% { opacity: 0; transform: translateY(30px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        .subtitle {
            color: var(--accent);
            font-size: 0.9rem;
            font-weight: 700;
            letter-spacing: 4px;
            text-transform: uppercase;
            margin-bottom: 1rem;
        }

        .avatar-container {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            overflow: hidden;
            border: 2px solid var(--accent);
            margin: 0.5rem 0;
            box-shadow: 0 0 30px rgba(255, 42, 95, 0.3);
            animation: float 6s ease-in-out infinite;
        }
        .avatar-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        @keyframes float {
            0% { transform: translateY(0); }
            50% { transform: translateY(-10px); box-shadow: 0 10px 40px rgba(255, 42, 95, 0.5); }
            100% { transform: translateY(0); }
        }

        .name-title {
            font-size: clamp(2rem, 5vw, 4.5rem);
            font-weight: 700;
            line-height: 1.1;
            letter-spacing: -0.01em;
            margin-bottom: 2rem;
        }

        .email-title {
            font-size: clamp(1.5rem, 4vw, 4rem);
            font-weight: 900;
            line-height: 1;
            letter-spacing: -0.02em;
            text-transform: uppercase;
            margin-bottom: 2rem;
            color: rgba(255, 255, 255, 0.8);
        }

        /* 炫酷联系按钮 */
        .contact-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 18px 40px;
            background: transparent;
            color: var(--fg);
            font-size: 1rem;
            font-weight: 700;
            letter-spacing: 3px;
            text-transform: uppercase;
            text-decoration: none;
            border: 1px solid var(--accent);
            border-radius: 50px;
            position: relative;
            overflow: hidden;
            transition: all 0.4s;
            cursor: pointer;
        }
        .contact-btn::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: var(--accent);
            transform: scaleX(0);
            transform-origin: right;
            transition: transform 0.5s cubic-bezier(0.16, 1, 0.3, 1);
            z-index: -1;
        }
        .contact-btn:hover::before {
            transform: scaleX(1);
            transform-origin: left;
        }
        .contact-btn:hover {
            box-shadow: 0 0 30px rgba(255, 42, 95, 0.4);
            transform: translateY(-3px);
        }

        .btn-group {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .github-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 18px 40px;
            background: rgba(255, 255, 255, 0.05);
            color: var(--fg);
            font-size: 1rem;
            font-weight: 700;
            letter-spacing: 3px;
            text-transform: uppercase;
            text-decoration: none;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 50px;
            transition: all 0.4s;
            cursor: pointer;
        }
        .github-btn:hover {
            background: rgba(255, 255, 255, 0.15);
            border-color: #fff;
            transform: translateY(-3px);
            box-shadow: 0 0 20px rgba(255,255,255,0.1);
        }

        /* 底部信息 */
        .footer-info {
            position: absolute;
            bottom: 3rem;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            display: flex;
            gap: 2rem;
            font-size: 0.8rem;
            color: var(--muted);
            letter-spacing: 1px;
        }
        .footer-info a {
            color: var(--muted);
            text-decoration: none;
            transition: color 0.3s;
        }
        .footer-info a:hover {
            color: var(--fg);
        }
        
        @media (max-width: 768px) {
            .footer-info {
                flex-direction: column;
                gap: 1rem;
                bottom: 2rem;
                text-align: center;
            }
        }
    </style>
</head>
<body>
    <div id="particles-js"></div>

    <nav class="navbar">
        <a href="index.html">Back to Home</a>
    </nav>

    <div class="content-wrapper">
        <div class="subtitle">START COLLABORATION</div>
        <div class="avatar-container">
            <img src="assets/portal-avatar.png" alt="Avatar">
        </div>
        <div class="name-title" id="user-display-name">
            Senor<br>
            (Chunyu Wan)
        </div>
        
        <div class="btn-group">
            <a href="about.html" class="contact-btn">联系我 (CONTACT ME)</a>
            <a href="https://github.com/SenorPink0487" class="github-btn" target="_blank">
                <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
                    <path d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"/>
                </svg>
                GITHUB
            </a>
        </div>
    </div>

    <!-- 引入 particles.js 实现星空连线背景 -->
    <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
    <script>
        particlesJS("particles-js", {
            "particles": {
                "number": { "value": 60, "density": { "enable": true, "value_area": 800 } },
                "color": { "value": "#ffffff" },
                "shape": { "type": "circle" },
                "opacity": { "value": 0.4, "random": false },
                "size": { "value": 2, "random": true },
                "line_linked": {
                    "enable": true,
                    "distance": 150,
                    "color": "#ffffff",
                    "opacity": 0.2,
                    "width": 1
                },
                "move": {
                    "enable": true,
                    "speed": 1.5,
                    "direction": "none",
                    "random": false,
                    "straight": false,
                    "out_mode": "out",
                    "bounce": false,
                    "attract": { "enable": false, "rotateX": 600, "rotateY": 1200 }
                }
            },
            "interactivity": {
                "detect_on": "canvas",
                "events": {
                    "onhover": { "enable": true, "mode": "grab" },
                    "onclick": { "enable": true, "mode": "push" },
                    "resize": true
                },
                "modes": {
                    "grab": { "distance": 200, "line_linked": { "opacity": 0.5 } },
                    "push": { "particles_nb": 3 }
                }
            },
            "retina_detect": true
        });
    </script>
</body>
</html>
